# En-têtes de sécurité, dans un fichier À PART.
#
# POURQUOI UN FICHIER PLUTÔT QUE DES LIGNES RÉPÉTÉES
#     nginx N'HÉRITE PAS des `add_header` : dès qu'un bloc `location` en déclare
#     un, tous ceux du niveau supérieur sont abandonnés DANS CE BLOC, sans
#     avertissement. Constaté en testant l'image : `/` passe par `try_files`
#     vers `/index.html`, qui pose son `Cache-Control` — et la page principale
#     arrivait donc sans aucun en-tête de sécurité, en silence.
#
#     Les recopier dans chaque bloc marche, mais garantit qu'un futur bloc les
#     oubliera. Un `include` unique rend l'oubli visible : une ligne manquante
#     se repère, quatre lignes manquantes se confondent avec le reste.
add_header X-Content-Type-Options  "nosniff"     always;
add_header X-Frame-Options         "DENY"        always;
add_header Referrer-Policy         "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
