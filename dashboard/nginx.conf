# Configuration nginx du dashboard.
#
# DEUX RÔLES, ET C'EST DÉLIBÉRÉ
#     1. Servir les fichiers statiques produits par Vite.
#     2. Relayer `/api/…` vers le service d'API.
#
#     POURQUOI UN RELAIS PLUTÔT QU'UNE URL D'API DANS L'IMAGE
#         Vite compile `VITE_API_BASE` AU MOMENT DE LA CONSTRUCTION : l'URL est
#         figée dans le JavaScript livré. Y mettre une adresse obligerait à
#         reconstruire une image par environnement — développement, recette,
#         production — alors qu'une image doit être promue telle quelle d'un
#         environnement à l'autre. Avec un chemin relatif (`/api`), la même
#         image fonctionne partout et c'est nginx qui sait où joindre l'API.
#
#         Effet de bord bienvenu : plus de requête inter-origines, donc aucune
#         configuration CORS à maintenir côté API.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Le nom du service est résolu à CHAQUE requête, pas une fois au démarrage.
    # Sans cela, nginx refuse de démarrer tant que l'API n'est pas joignable —
    # un simple ordre de démarrage suffirait à casser toute la pile.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compression : le paquet JavaScript d'un tableau de bord React est lourd.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # En-têtes de sécurité. Un outil de sécurité dont l'interface n'en pose
    # aucun se fait remarquer au premier examen.
    #
    # ⚠️ NGINX N'HÉRITE PAS DE CES EN-TÊTES : dès qu'un bloc `location` déclare
    #    son propre `add_header`, TOUS ceux du niveau supérieur sont abandonnés
    #    dans ce bloc. Constaté en testant l'image : `/` passe par `try_files`
    #    vers `/index.html`, qui a son `Cache-Control` — et la page principale
    #    arrivait donc SANS aucun en-tête de sécurité, en silence.
    #    Ils sont donc répétés dans chaque bloc qui pose un en-tête.
    include /etc/nginx/conf.d/security-headers.conf;

    # --- Relais vers l'API -------------------------------------------------
    # Le préfixe « /api » est RETIRÉ avant transmission :
    #     /api/audits  ->  http://ai_security_api:8000/audits
    location /api/ {
        set $api_upstream ai_security_api:8000;

        # ⚠️ PIÈGE NGINX : quand `proxy_pass` utilise une VARIABLE, la barre
        #    oblique finale ne retire PLUS le préfixe. L'API recevait donc
        #    « /api/audits » et répondait 404 — le relais fonctionnait, seul le
        #    chemin était faux. Constaté en lançant la pile complète.
        #    La réécriture explicite fait le travail que la barre oblique ne
        #    fait plus.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Un audit dure des heures ; le lancement rend la main tout de suite,
        # mais la lecture d'un gros rapport peut être lente. Les délais par
        # défaut de nginx (60 s) coupaient ces réponses.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Le suivi d'exécution est diffusé au fil de l'eau : le tamponner
        # ferait arriver la progression d'un coup, à la fin.
        proxy_buffering off;
    }

    # --- Fichiers statiques ------------------------------------------------
    # Les fichiers versionnés par empreinte peuvent être mis en cache
    # indéfiniment ; `index.html` ne le doit jamais, sinon un navigateur
    # continue de charger l'ancien paquet après un déploiement.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Sonde de vivacité du serveur web lui-même, distincte de celle de l'API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Repli d'application monopage : toute route inconnue rend `index.html`,
    # sinon un rechargement sur /audits/… donnerait un 404 de nginx alors que
    # c'est une route gérée côté navigateur.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
