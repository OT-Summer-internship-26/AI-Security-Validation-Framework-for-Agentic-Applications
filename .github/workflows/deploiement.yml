# ==============================================================================
#  Déploiement — la seule porte par laquelle une image entre en production
#
#  POURQUOI CE WORKFLOW EXISTE
#      La chaîne s'arrêtait à l'image publiée. Le déploiement était une procédure
#      manuelle écrite dans un document (`integration_guide.md` §6) : quelqu'un
#      copiait un condensé, éditait un `.env`, lançait deux commandes. Ça marche
#      — jusqu'au jour où quelqu'un se trompe de condensé, saute la vérification
#      de signature, ou déploie depuis un poste dont personne ne sait ce qu'il
#      contient. Une procédure documentée n'est pas une procédure appliquée.
#
#  CE QU'IL APPORTE, ET QUI NE PEUT PAS ÊTRE FAIT À LA MAIN DE FAÇON FIABLE
#      1. UNE APPROBATION. Le job cible un *GitHub Environment* : si vous y
#         attachez une règle de protection, personne ne déploie sans qu'un
#         humain ait cliqué. C'est la seule barrière qui résiste à la fatigue.
#      2. UNE VÉRIFICATION DE SIGNATURE **AVANT** de déployer. La chaîne signe
#         les images ; rien ne servait cette signature. Ici, une image dont la
#         signature ne se vérifie pas N'EST PAS DÉPLOYÉE — c'est tout l'intérêt
#         d'avoir signé.
#      3. UN DÉPLOIEMENT PAR CONDENSÉ. Une étiquette peut être repoussée ; un
#         condensé désigne des octets. On ne déploie pas « la dernière », on
#         déploie CELLE-LÀ.
#
#  CE QU'IL NE FAIT PAS, ET POURQUOI
#      Il ne choisit pas votre cible. L'hôte, l'accès et la fenêtre de
#      déploiement sont des décisions d'organisation, pas de dépôt. Le transport
#      SSH reste INERTE tant que ses secrets n'existent pas : le workflow rend
#      alors les commandes exactes à jouer, et s'arrête là. Même principe que la
#      signature, qui est restée inactive jusqu'à ce que la clé existe.
# ==============================================================================
name: Déploiement

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette publiée à déployer (ex. sha-a1b2c3d)"
        required: true
      environnement:
        description: "Environnement cible"
        required: true
        default: production
        type: choice
        options: [production, preproduction]

permissions:
  contents: read
  packages: read

concurrency:
  # Un seul déploiement à la fois PAR ENVIRONNEMENT, et on n'annule pas :
  # interrompre un `compose up` laisserait la pile à moitié montée.
  group: deploiement-${{ inputs.environnement }}
  cancel-in-progress: false

jobs:
  deployer:
    name: Déployer ${{ inputs.version }} sur ${{ inputs.environnement }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # LA PORTE D'APPROBATION.
    #     Attachez une règle de protection à cet environnement dans
    #     Settings → Environments : le job attendra alors qu'un humain approuve.
    #     Sans règle, il passe — le mécanisme est là, la politique vous revient.
    environment: ${{ inputs.environnement }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique COMPLET : on doit pouvoir remonter au commit dont vient
          # l'image demandee, qui n'est pas forcement la tete de la branche.
          fetch-depth: 0

      - uses: sigstore/cosign-installer@v3.7.0
        with:
          # Même version que la chaîne de publication : `--tlog-upload=false` et
          # `--insecure-ignore-tlog` ne se comportent pas pareil ailleurs.
          cosign-release: 'v2.4.1'

      - name: Résoudre le CONDENSÉ de l'étiquette
        id: resoudre
        run: |
          set -euo pipefail
          DEPOT=$(echo "ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Le condensé se CALCULE à partir des octets du manifeste. `imagetools
          # inspect --format` a été essayé : sur buildx v0.30.1 le drapeau est
          # ignoré en silence et la commande sort son listing complet.
          for IMAGE in ai-security-framework ai-security-dashboard; do
            D=$(docker buildx imagetools inspect "$DEPOT/$IMAGE:${{ inputs.version }}" --raw \
                | sha256sum | awk '{print "sha256:"$1}')
            # NOM DE SORTIE SANS TIRET, ET C'EST OBLIGATOIRE.
            #     `steps.x.outputs.ai-security-framework` serait analyse par
            #     GitHub comme `ai` MOINS `security` MOINS `framework` : les
            #     tirets sont des operateurs dans ses expressions. On derive donc
            #     une cle courte (`api` / `dashboard`).
            CLE=$([ "$IMAGE" = "ai-security-framework" ] && echo api || echo dashboard)
            echo "${CLE}=${DEPOT}/${IMAGE}@${D}" >> "$GITHUB_OUTPUT"
            echo "$IMAGE -> $DEPOT/$IMAGE@$D"
          done

      - name: Extraire la TOPOLOGIE du commit déployé
        id: topologie
        # D6 — ON DÉPLOIE DES IMAGES ÉPINGLÉES SOUS UNE TOPOLOGIE QUELCONQUE.
        #     Le condensé garantit l'octet près QUELLE image tourne. Il ne dit
        #     rien de `docker-compose.yml` : ports, volumes, limites mémoire,
        #     `healthcheck`, `stop_grace_period`. Ce fichier restait celui
        #     présent sur l'hôte, sans garantie qu'il corresponde au commit dont
        #     viennent les images.
        #
        #     Ce que ça peut donner, concrètement : des images à jour orchestrées
        #     par une topologie d'il y a six mois — le `stop_grace_period: 2h` de
        #     l'ouvrier absent, et chaque déploiement détruit une heure de calcul
        #     sans que personne ne comprenne pourquoi.
        #
        #     On lit donc le compose AU COMMIT DÉPLOYÉ, et c'est celui-là qu'on
        #     envoie. Aucune hypothèse sur la façon dont l'hôte est géré : le
        #     dépôt est déjà là, `git show` suffit.
        run: |
          set -euo pipefail
          # `sha-a1b2c3d` -> `a1b2c3d` ; `1.2.3` -> le tag git `v1.2.3`.
          REF="${{ inputs.version }}"
          case "$REF" in
            sha-*) COMMIT="${REF#sha-}" ;;
            *)     COMMIT="v$REF" ;;
          esac

          COMPLET=$(git rev-parse --verify "$COMMIT^{commit}" 2>/dev/null) || {
            echo "::error::impossible de retrouver le commit de « ${{ inputs.version }} »."
            echo "::error::L'image existe peut-être, mais sa topologie est introuvable —"
            echo "::error::déployer sous un compose inconnu serait pire que ne pas déployer."
            exit 1
          }
          echo "commit déployé : $COMPLET"
          git show "$COMPLET:docker-compose.yml" > compose-deploye.yml
          echo "commit=$COMPLET" >> "$GITHUB_OUTPUT"

          # Un compose qui a changé depuis la tête de branche mérite d'être vu :
          # c'est le genre d'écart qu'on veut connaître AVANT, pas après.
          if ! diff -q docker-compose.yml compose-deploye.yml > /dev/null 2>&1; then
            echo "::warning::le compose de ce commit DIFFÈRE de celui de la branche courante"
            {
              echo "### Topologie déployée ≠ topologie de la branche"
              echo ""
              echo '```diff'
              diff -u docker-compose.yml compose-deploye.yml | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: La signature tient-elle ? (sinon ON NE DÉPLOIE PAS)
        # C'EST L'ÉTAPE QUI DONNE UN SENS À LA SIGNATURE.
        #     Signer sans jamais vérifier revient à mettre un cadenas et à
        #     laisser la clé sur la porte : ça coûte le même travail et ça ne
        #     protège de rien. Ici, une image dont la signature ne se vérifie pas
        #     arrête le déploiement — c'est le seul moment où la signature sert.
        #
        #     `--insecure-ignore-tlog` est requis PARCE QUE la signature n'a
        #     volontairement pas été publiée dans le journal de transparence
        #     public. Le nom du drapeau est alarmant ; ce qu'il décrit ici est un
        #     choix de confidentialité assumé.
        #
        #     `cosign.pub` est versionnée dans ce dépôt : c'est précisément à ça
        #     qu'elle sert, et c'est pour ça qu'elle DOIT y être.
        run: |
          set -euo pipefail
          for REF in "${{ steps.resoudre.outputs.api }}" \
                     "${{ steps.resoudre.outputs.dashboard }}"; do
            echo "::group::vérification $REF"
            cosign verify --key cosign.pub --insecure-ignore-tlog=true "$REF"
            cosign verify-attestation --key cosign.pub --type cyclonedx \
                   --insecure-ignore-tlog=true "$REF" > /dev/null
            echo "signature ET inventaire vérifiés"
            echo "::endgroup::"
          done

      - name: Déployer
        env:
          HOTE: ${{ secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ secrets.DEPLOY_USER }}
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          CHEMIN: ${{ secrets.DEPLOY_PATH }}
          EMPREINTE: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          API="${{ steps.resoudre.outputs.api }}"
          DASH="${{ steps.resoudre.outputs.dashboard }}"

          # LA VERSION EN PLACE EST NOTEE AVANT D'ETRE REMPLACEE.
          #     Sans ca, un controle de sante qui echoue laisse la production
          #     cassee ET personne pour dire vers quoi revenir : il faudrait
          #     retrouver le condense precedent dans l'historique des executions,
          #     au pire moment. `/health` rend le champ `build` depuis peu — on
          #     s'en sert ici, avant de toucher a quoi que ce soit.
          #     Echec silencieux volontaire : si l'API ne repond pas encore (tout
          #     premier deploiement), il n'y a rien a noter, et ce n'est pas une
          #     erreur.
          PRECEDENT=""
          if [ -n "${{ secrets.DEPLOY_HEALTH_URL }}" ]; then
            PRECEDENT=$(curl -fsS --max-time 10 "${{ secrets.DEPLOY_HEALTH_URL }}" 2>/dev/null \
                        | python3 -c "import json,sys;print(json.load(sys.stdin).get('build',''))" 2>/dev/null || true)
          fi
          echo "BUILD_PRECEDENT=$PRECEDENT" >> "$GITHUB_ENV"
          echo "version actuellement en service : ${PRECEDENT:-(inconnue)}"

          # LES COMMANDES SONT RENDUES DANS TOUS LES CAS.
          #     Même sans transport configuré, ce workflow a déjà fait le
          #     difficile : résoudre le condensé et VÉRIFIER la signature. Rendre
          #     les commandes exactes permet de déployer à la main sans refaire
          #     ce travail — et sans risquer de se tromper de condensé.
          {
            echo "### Déploiement — ${{ inputs.environnement }}"
            echo ""
            echo '```bash'
            echo "AUDIT_REF_API=$API"
            echo "AUDIT_REF_DASHBOARD=$DASH"
            echo "docker compose pull && docker compose up -d --no-build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${HOTE:-}" ] || [ -z "${CLE:-}" ]; then
            echo "::notice::Transport SSH non configuré (DEPLOY_HOST / DEPLOY_SSH_KEY)."
            echo "::notice::Signature vérifiée, condensés résolus — commandes dans le résumé."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # L'EMPREINTE DE L'HOTE EST VERIFIEE SI ON LA CONNAIT.
          #     `ssh-keyscan` seul accepte ce que l'hote presente, sans rien
          #     verifier : c'est de la confiance au premier contact, donc une
          #     fenetre d'interception a chaque execution sur un runner NEUF —
          #     et un runner GitHub est toujours neuf. Pour un outil de securite
          #     qui deploie sa propre chaine, c'est le mauvais endroit ou etre
          #     approximatif.
          #     Renseignez `DEPLOY_HOST_KEY` (sortie de `ssh-keyscan` faite UNE
          #     fois depuis un poste de confiance) : l'empreinte est alors
          #     imposee. Sans ce secret, on retombe sur le scan, et on le DIT.
          if [ -n "${EMPREINTE:-}" ]; then
            echo "$EMPREINTE" > ~/.ssh/known_hosts
            echo "empreinte d'hote imposee depuis DEPLOY_HOST_KEY"
          else
            echo "::warning::DEPLOY_HOST_KEY absent — l'empreinte de $HOTE est acceptee sans verification (confiance au premier contact)."
            ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # `--no-build` n'est pas cosmétique : sans lui, compose reconstruirait
          # si l'image manque, et on exécuterait un artefact que rien n'a vérifié.
          # LA TOPOLOGIE PART AVEC LES IMAGES, ET AVANT ELLES.
          #     Envoyer le compose du commit deploye est ce qui rend le
          #     deploiement reellement reproductible : sans lui, on epinglait les
          #     images a l'octet pres pour les faire tourner sous un fichier dont
          #     personne ne connaissait la version.
          scp -i ~/.ssh/id_deploiement -o BatchMode=yes \
              compose-deploye.yml "$UTILISATEUR@$HOTE:$CHEMIN/docker-compose.yml"

          ssh -i ~/.ssh/id_deploiement -o BatchMode=yes "$UTILISATEUR@$HOTE" \
            "cd '$CHEMIN' \
             && sed -i '/^AUDIT_REF_API=/d;/^AUDIT_REF_DASHBOARD=/d' .env \
             && echo 'AUDIT_REF_API=$API' >> .env \
             && echo 'AUDIT_REF_DASHBOARD=$DASH' >> .env \
             && docker compose pull \
             && docker compose up -d --no-build"

          echo "déployé : $API"

      - name: La pile déployée répond-elle ?
        # Un déploiement qui ne se vérifie pas est un déploiement qu'on croit
        # réussi. `/health` rend désormais le champ `build` : on peut donc
        # confirmer que c'est BIEN la version demandée qui répond, et pas
        # l'ancienne restée en place parce que `up -d` n'a rien recréé.
        env:
          URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          # LE TEST EST DANS LE SCRIPT, PAS DANS UN `if:` D'ETAPE.
          #     Le contexte `secrets` n'est pas disponible dans une condition
          #     d'etape : `if: ${{ secrets.X != '' }}` y est toujours evalue a
          #     vide, donc l'etape aurait ete SYSTEMATIQUEMENT sautee — un
          #     controle post-deploiement qui ne s'execute jamais.
          if [ -z "${URL:-}" ]; then
            echo "::notice::DEPLOY_HEALTH_URL non configurée — contrôle post-déploiement ignoré."
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl -fsS "$URL" > /tmp/sante.json 2>/dev/null; then break; fi
            sleep 4
          done
          cat /tmp/sante.json
          BUILD=$(python3 -c "import json;print(json.load(open('/tmp/sante.json')).get('build',''))")
          # ON COMPARE AU COMMIT, PAS A L'ETIQUETTE.
          #     L'image embarque `AUDIT_BUILD=sha-<SHA COMPLET>` (images.yml),
          #     l'etiquette publiee est `sha-<7>` ou `1.2.3`. Comparer `build` a
          #     `inputs.version` echouait donc A CHAQUE deploiement reussi, et
          #     reclamait un retour arriere. Le commit, lui, est deja resolu par
          #     l'etape `topologie`, pour les deux formes d'etiquette.
          ATTENDU="sha-${{ steps.topologie.outputs.commit }}"
          if [ "$BUILD" != "$ATTENDU" ]; then
            echo "::error::l'API répond en build « $BUILD » alors que ${{ inputs.version }} ($ATTENDU) a été déployée"
            # UN ECHEC QUI NE DIT PAS COMMENT REVENIR N'EST QU'UNE MAUVAISE NOUVELLE.
            #     La production est peut-etre cassee a cet instant. Chercher le
            #     condense precedent dans l'historique des executions, sous
            #     pression, est exactement ce qu'on ne veut pas avoir a faire.
            #
            #     `/health` rend le SHA COMPLET, mais ce workflow attend une
            #     ETIQUETTE PUBLIEE : `sha-<7>`. Proposer le SHA complet envoyait
            #     l'operateur vers une image qui n'existe pas. `inconnu` (image
            #     construite hors chaine) n'a aucune etiquette a proposer.
            case "${BUILD_PRECEDENT:-}" in
              sha-*)
                RETOUR="sha-$(printf '%s' "${BUILD_PRECEDENT#sha-}" | cut -c1-7)"
                {
                  echo "### ⚠ Retour arrière"
                  echo ""
                  echo "La version en service avant ce déploiement était **\`$BUILD_PRECEDENT\`**."
                  echo "Relancez ce workflow avec \`version = $RETOUR\`."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error::revenir en arrière : relancer ce workflow avec version = $RETOUR" ;;
              "")
                echo "::error::version précédente inconnue — l'API ne répondait pas avant le déploiement." ;;
              *)
                echo "::error::version précédente « $BUILD_PRECEDENT » construite hors chaîne : aucune étiquette publiée vers laquelle revenir." ;;
            esac
            exit 1
          fi
          echo "confirmé : la version en service est bien ${{ inputs.version }} ($BUILD)"
