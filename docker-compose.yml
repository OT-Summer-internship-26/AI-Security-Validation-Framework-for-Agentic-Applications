# ==============================================================================
#  Services du framework — API d'audit
#
#  ⚠️ CE FICHIER NE CONTIENT PAS LANGFUSE
#      Il en déclarait un service, mais celui-ci ne pouvait PAS démarrer : il
#      pointait une base `db` jamais définie, et l'image `langfuse:latest` est une
#      v3 qui exige ClickHouse, Redis et MinIO. Laisser ce service ici donnait un
#      `docker compose up` qui échoue — pire qu'une absence, parce que le lecteur
#      croit la brique disponible.
#
#      L'observabilité vit dans **docker-compose.langfuse.yml**, une pile
#      complète et vérifiée (traces réellement reçues) :
#          docker compose -f docker-compose.langfuse.yml up -d
#
#  DÉMARRAGE
#      docker compose up -d --build
#      curl http://localhost:8000/health
#
#  Les contraintes d'exploitation (résidence des données, instance unique,
#  sandbox) sont documentées dans docs/architecture_technique.md, section
#  « Contraintes de déploiement ». Les lire AVANT de planifier une mise en
#  production, pas après.
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-security-framework:latest
    container_name: ai_security_api
    ports:
      # Port publié configurable : un port en dur finit toujours par entrer en
      # collision avec un service déjà installé sur la machine hôte.
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Les résultats vivent sur le volume, PAS dans le conteneur : son disque
      # est éphémère et un audit d'une heure disparaîtrait au redémarrage.
      AUDIT_DATA_DIR: /var/lib/ai-security
      # La gestion des laboratoires d'entraînement démarre des conteneurs sur
      # l'hôte : elle reste FERMÉE hors poste de développement jetable.
      ENABLE_LAB_MANAGEMENT: "0"
      # L'API DEPOSE, l'ouvrier EXECUTE. A 1, l'API executerait elle-meme et un
      # redeploiement tuerait les audits en cours — c'est le mode developpement.
      AUDIT_INLINE_WORKER: "0"
    volumes:
      - audit_data:/var/lib/ai-security

    # L'état vit désormais dans SQLite sur le volume partagé (`api/store.py`) :
    # plusieurs répliques voient les mêmes exécutions, et un redémarrage ne perd
    # plus rien. Le plafond restant est celui de SQLite sur volume RÉSEAU, qui
    # verrouille mal — voir « Contraintes de déploiement » dans la doc technique.
    deploy:
      replicas: 1

    # La couche dynamique (sandbox ASI05) exige `docker run`, donc le socket du
    # démon. Le monter donne au conteneur la RACINE DE L'HÔTE : à n'activer que
    # sur un poste jetable, jamais sur une machine partagée. Sans lui le
    # framework dégrade proprement — la couche se déclare non applicable, elle
    # n'est ni notée 0 ni comptée comme réussie.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped
    networks: [ai_security]

  # L'OUVRIER — c'est lui qui execute les audits, pas l'API.
  #
  # POURQUOI UN SERVICE SEPARE
  #     Un audit dure une heure. Tant qu'il vivait dans un fil du serveur web,
  #     le moindre redeploiement le tuait. Ici, redemarrer l'API n'interrompt
  #     rien, et redemarrer l'ouvrier remet son travail en file — il est repris.
  #
  # MISE A L'ECHELLE : `--scale worker=2` suffit, la prise de travail est
  #     atomique. Au-dela de deux ou trois, le quota du modele devient le goulot
  #     et rien n'est gagne.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-security-framework:latest
    command: ["python", "scripts/worker.py"]
    env_file:
      - .env
    environment:
      AUDIT_DATA_DIR: /var/lib/ai-security
      ENABLE_LAB_MANAGEMENT: "0"
    volumes:
      # MEME volume que l'API : c'est par lui que passent la file, l'etat des
      # executions et les fichiers de resultat. Les separer ferait voir a l'API
      # des audits termines dont le rapport serait introuvable.
      - audit_data:/var/lib/ai-security
    depends_on:
      api:
        condition: service_healthy
    networks: [ai_security]
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: ai-security-dashboard:latest
    container_name: ai_security_dashboard
    ports:
      # 8080 est l'un des ports les plus disputés d'une machine de
      # développement — sur celle-ci, le nginx des laboratoires DVAP le tenait
      # déjà et `compose up` échouait. D'où la variable.
      - "${DASHBOARD_PORT:-8080}:8080"
    # `depends_on` seul ne garantit que l'ORDRE de démarrage, pas la
    # disponibilité. Attendre la sonde de l'API évite que le dashboard serve une
    # page dont chaque appel échoue pendant les vingt premières secondes.
    depends_on:
      api:
        condition: service_healthy
    networks: [ai_security]
    restart: unless-stopped

# Réseau explicite : nginx joint l'API par son NOM DE SERVICE
# (`ai_security_api:8000`, voir dashboard/nginx.conf). Sur le réseau par défaut
# la résolution fonctionne aussi, mais la nommer rend la dépendance visible —
# et c'est elle qu'il faudra changer si l'API part sur une autre machine.
networks:
  ai_security:
    driver: bridge

volumes:
  audit_data:
