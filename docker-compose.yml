# ==============================================================================
#  Services du framework — API d'audit
#
#  ⚠️ CE FICHIER NE CONTIENT PLUS LANGFUSE
#      Il en déclarait un service, mais celui-ci ne pouvait PAS démarrer : il
#      pointait une base `db` jamais définie, et l'image `langfuse:latest` est une
#      v3 qui exige ClickHouse, Redis et MinIO. Laisser ce service ici donnait un
#      `docker compose up` qui échoue — pire qu'une absence, parce que le lecteur
#      croit la brique disponible.
#
#      L'observabilité vit désormais dans **docker-compose.langfuse.yml**, une
#      pile complète et vérifiée (traces réellement reçues, cf. NOTES.md) :
#          docker compose -f docker-compose.langfuse.yml up -d
#
#  ⚠️ LE SERVICE `api` EXIGE UN Dockerfile QUI N'EXISTE PAS ENCORE
#      Il est laissé ici parce qu'il décrit l'intention, mais `docker compose up`
#      échouera au build tant que le Dockerfile n'est pas écrit. En attendant,
#      l'API se lance directement :
#          uvicorn api.main:app --reload        (ou run-api.bat)
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile   # ⚠️ à écrire — voir l'avertissement ci-dessus
    container_name: ai_security_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Le module sandbox (ASI05) exécute du code dans des conteneurs Docker
    # éphémères : monter le socket Docker sera nécessaire pour la couche dynamique.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
